<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>screenshot-2-edit.html</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <section class="copy">
      <div class="brand"><img src="../../icons/icon128.png" alt="" />Apps Launcher &amp; Mail Checker</div>
      <h1>Раскладка под себя</h1>
      <p>Нажмите карандаш и перетаскивайте плитки: частые — в «Избранное», лишние — в «Скрытые». С включённой синхронизацией Chrome раскладка одинакова на всех ваших компьютерах.</p>
    </section>

    <div class="window" data-badge="7" data-pressed>
      <div class="page"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="popup"><iframe src="../../dev/preview-popup.html" title="popup"></iframe></div>
    </div>

    <script type="module">
      import { mountPopup, report } from './common.js';

      // Перенос запускается настоящими pointer-событиями, чтобы снимок показал то,
      // что рисует popup: «Презентации» на пути в «Избранное», на месте «Документов».
      async function dragMidway(frame) {
        const doc = await mountPopup(frame, { edit: true });
        const win = frame.contentWindow;
        const center = (el, dx = 0, dy = 0) => {
          const r = el.getBoundingClientRect();
          return { clientX: r.left + r.width / 2 + dx, clientY: r.top + r.height / 2 + dy };
        };
        const pointer = (type, target, point) => target.dispatchEvent(new win.PointerEvent(type, {
          bubbles: true, cancelable: true, pointerId: 1, isPrimary: true, button: 0, ...point,
        }));

        const tile = doc.querySelector('#others .tile');
        const to = center(doc.querySelectorAll('#favorites .tile')[4], -12, 10);
        pointer('pointerdown', tile, center(tile));
        pointer('pointermove', win, to);
      }

      report(dragMidway(document.querySelector('.popup iframe')));
    </script>
  </body>
</html>
